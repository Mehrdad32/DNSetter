name: DNSetter CI

on:
  push:
    branches: [master, 'feat/v2-*']
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.x'
      - name: Run Core regression tests (no real DNS changes)
        run: dotnet run --project tests/DNSetter.Core.Tests/DNSetter.Core.Tests.csproj -c Release

  windows-build:
    needs: core-tests
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        rid: [win-x64, win-x86]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.x'
      - name: Publish Windows test build
        run: dotnet publish DNSetter.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o publish/${{ matrix.rid }}
      - name: Validate native Windows UI and capture previews
        timeout-minutes: 3
        if: matrix.rid == 'win-x64'
        run: dotnet run --project tests/DNSetter.Ui.Smoke/DNSetter.Ui.Smoke.csproj -c Release -- ui-preview
      - name: Upload UI previews
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DNSetter-ui-preview
          path: ui-preview/
          if-no-files-found: error
      - name: Upload test build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DNSetter-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/
          if-no-files-found: error
