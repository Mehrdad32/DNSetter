name: Release

on:
  push:
    branches: [master]
    tags: ['v*']
    paths: ['DNSetter.csproj']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: Check version and existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ref = os.environ['GITHUB_REF']
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' and ref != 'refs/heads/master':
              raise SystemExit('Manual releases must run from master.')
          version = ET.parse('DNSetter.csproj').findtext('./PropertyGroup/Version', '').strip()
          if not re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', version):
              raise SystemExit('Release requires a stable major.minor.patch version.')
          tag = f'v{version}'
          if ref.startswith('refs/tags/') and ref != f'refs/tags/{tag}':
              raise SystemExit('The pushed tag does not match the project version.')
          notes = Path('docs/release-notes') / f'{tag}.md'
          if not notes.is_file():
              raise SystemExit(f'Missing release notes: {notes}')
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/{tag}"
          request = urllib.request.Request(url, headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'DNSetter-release',
          })
          try:
              with urllib.request.urlopen(request, timeout=30):
                  should_release = 'false'
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              should_release = 'true'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\ntag={tag}\nshould_release={should_release}\n')
          print(f'{tag}: ' + ('build and publish' if should_release == 'true' else 'already published; skipped'))
          PY
      - name: Run Core regression tests
        if: steps.version.outputs.should_release == 'true'
        run: dotnet run --project tests/DNSetter.Core.Tests/DNSetter.Core.Tests.csproj -c Release

  windows-build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        rid: [win-x64, win-x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: Publish self-contained Windows app
        run: dotnet publish DNSetter.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o publish/${{ matrix.rid }}
      - name: Validate native Windows UI
        if: matrix.rid == 'win-x64'
        timeout-minutes: 3
        run: dotnet run --project tests/DNSetter.Ui.Smoke/DNSetter.Ui.Smoke.csproj -c Release -- ui-preview
      - name: Package app and documentation
        env:
          RELEASE_RID: ${{ matrix.rid }}
        run: |
          $output = "publish/$env:RELEASE_RID"
          Copy-Item LICENSE, README.md, README.en.md, CHANGELOG.md, CONTRIBUTING.md -Destination $output
          Copy-Item docs -Destination $output -Recurse
          Remove-Item "$output/*.pdb" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$output/*" -DestinationPath "DNSetter-$env:RELEASE_RID.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: DNSetter-${{ matrix.rid }}.zip
          if-no-files-found: error

  publish:
    needs: [prepare, windows-build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Generate SHA-256 checksums
        run: |
          $files = @(Get-ChildItem release -Filter '*.zip' | Sort-Object Name)
          if ($files.Count -ne 2) { throw 'Expected both Windows packages.' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($file.Name)"
          }
          [System.IO.File]::WriteAllLines("$pwd/release/SHA256SUMS.txt", [string[]]$lines, [System.Text.UTF8Encoding]::new($false))
      - name: Create tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create $env:RELEASE_TAG release/DNSetter-win-x64.zip release/DNSetter-win-x86.zip release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "DNSetter $env:RELEASE_VERSION" --notes-file "docs/release-notes/$env:RELEASE_TAG.md" --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
